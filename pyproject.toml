[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifckit"
version = "0.3.2"
description = "Framework-agnostic IFC builder library for architecture and infrastructure"
authors = [{ name = "Sander Boer", email = "sanderboer@mauc.nl" }]
readme = "README.md"
# >=3.9: Rhino 8 ships CPython 3.9 (only ifcopenshell<=0.8.4.post1 has 3.9 wheels).
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
keywords = ["ifc", "bim", "architecture", "ifcopenshell", "grasshopper", "rhino"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
# Pin policy (see AGENTS.md): never open-ended; >= min-proven, <= current-at-release.
# The max moves only at release time, after the matrix proved the new version.
ifc = ["ifcopenshell>=0.8.4.post1,<=0.9.0"]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=7,<8",
    "ifcopenshell>=0.8.4.post1,<=0.9.0",
    "httpx>=0.27,<0.29",
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<3; python_version >= '3.10'",
    "pdoc>=15,<17; python_version >= '3.10'",
]
api = [
    "fastapi>=0.111,<0.137",
    "uvicorn[standard]>=0.29,<0.47",
]
occ = ["pythonocc-core>=7.4,<8",
    "ifcopenshell>=0.8.4.post1,<=0.9.0"
]
# NOTE: no `occ` here — pythonocc-core has no PyPI distribution
# (conda-forge only), so it would break `pip install ifckit[all]`.
all = [
    "ifcopenshell>=0.8.4.post1,<=0.9.0",
    "fastapi>=0.111,<0.137",
    "uvicorn[standard]>=0.29,<0.47",
]

[project.urls]
Homepage   = "https://github.com/maucworks/ifckit"
Repository = "https://github.com/maucworks/ifckit"
Issues     = "https://github.com/maucworks/ifckit/issues"

[project.scripts]
ifckit = "ifckit.__main__:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ifckit*"]

[tool.setuptools.package-data]
ifckit = [
    "window_types/*.json",
    "ils/common/data/*.json",
    "ils/common/rules/*.py",
    "ils/minibim/data/*.json",
    "ils/woco/data/*.json",
]

[tool.ruff]
line-length    = 100
# py39 floor: Rhino 8 ships CPython 3.9. Keeps 3.10+ syntax out.
target-version = "py39"
exclude        = ["examples", "grasshopper", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ifckit.rhino_import",
    "ifckit.geometry.surface",
    "ifckit.rhinokit",
    "ifckit.bonsaikit",
    "ifckit.builders.wall_graph",
    "ifckit.geometry.intersection",
    "ifckit.geometry.curve",
    "ifckit.geometry.biarc",
    "ifckit.builders.wall",
    "ifckit.builders.slab",
    "ifckit.builders.space",
    "ifckit.builders.extruded",
    "ifckit.builders.revolved_beam",
    "ifckit.builders.sectioned_spine",
    "ifckit.builders.beam_factory",
    "ifckit.builders.bridge",
    "ifckit.builders.base",
    "ifckit.builders._geom",
    "ifckit.builders.component_graph",
    "ifckit.profiles.shapes",
    "ifckit.json_build",
    "ifckit.elements.types",
    "ifckit.elements.structural",
    "ifckit.elements.bridge",
]
ignore_errors = true

[tool.pdoc]
search = true
template_directory = "docs/pdoc_templates"
