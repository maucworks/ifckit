[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifckit"
version = "0.2.1"
description = "Framework-agnostic IFC builder library for architecture and infrastructure"
authors = [{ name = "Sander Boer", email = "sanderboer@mauc.nl" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
keywords = ["ifc", "bim", "architecture", "ifcopenshell", "grasshopper", "rhino"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ifcopenshell>=0.8.0",
    "httpx>=0.27",
    "ruff",
    "mypy",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]
occ = ["pythonocc-core>=7.4.0",
    "ifcopenshell>=0.8.0"
]
all = [
    "ifcopenshell>=0.8.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pythonocc-core>=7.4.0",
]

[project.urls]
Homepage   = "https://github.com/maucworks/ifckit"
Repository = "https://github.com/maucworks/ifckit"
Issues     = "https://github.com/maucworks/ifckit/issues"

[project.scripts]
ifckit = "ifckit.__main__:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ifckit*"]

[tool.setuptools.package-data]
ifckit = ["window_types/*.json"]

[tool.ruff]
line-length    = 100
target-version = "py310"
exclude        = ["examples", "grasshopper", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "ifckit.rhino_import",
    "ifckit.geometry.surface",
    "ifckit.rhinokit",
    "ifckit.bonsaikit",
    "ifckit.builders.wall_graph",
    "ifckit.geometry.intersection",
    "ifckit.geometry.curve",
    "ifckit.geometry.biarc",
    "ifckit.builders.wall",
    "ifckit.builders.slab",
    "ifckit.builders.space",
    "ifckit.builders.extruded",
    "ifckit.builders.revolved_beam",
    "ifckit.builders.sectioned_spine",
    "ifckit.builders.beam_factory",
    "ifckit.builders.bridge",
    "ifckit.builders.base",
    "ifckit.builders._geom",
    "ifckit.builders.component_graph",
    "ifckit.profiles.shapes",
    "ifckit.json_build",
    "ifckit.elements.types",
    "ifckit.elements.structural",
    "ifckit.elements.bridge",
]
ignore_errors = true
