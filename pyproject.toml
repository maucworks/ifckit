[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifckit"
version = "0.1.0"
description = "Framework-agnostic IFC builder library for architecture and infrastructure"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ifcopenshell>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "httpx>=0.27",
    "ruff",
    "mypy",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ifckit*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
ifckit = "ifckit.__main__:main"
